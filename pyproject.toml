[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-output-ai"
version = "0.1"
description = "Schema-validated JSON output from LLMs with automatic retries"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Scot P. Floess", email = "sfloess@nc.rr.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
jsonschema = ["jsonschema>=4.0"]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "bandit"]

[project.urls]
Homepage = "https://github.com/FlossWare/structured-output-ai"
Repository = "https://github.com/FlossWare/structured-output-ai"
Issues = "https://github.com/FlossWare/structured-output-ai/issues"

[tool.setuptools.packages.find]
include = ["structured_output_ai*"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
